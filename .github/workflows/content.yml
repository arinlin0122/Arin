name: Daily AI Briefing and Course Checks
on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * *'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate daily briefing
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: python scripts/update_content.py
      - name: Check course URLs once weekly
        run: |
          if [ "$(date -u +%u)" = "7" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then python scripts/check_courses.py; fi
      - name: Commit content updates
        run: |
          git config user.name "ai-mastery-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json data/course-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update AI daily briefing and link audit"
            git push
          fi
